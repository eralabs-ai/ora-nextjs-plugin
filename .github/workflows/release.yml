name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # changesets/action pushes the version PR branch
  pull-requests: write # ...and opens/updates the "Version Packages" PR
  id-token: write # npm provenance (publishConfig.provenance) needs OIDC

jobs:
  release:
    name: version PR / publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Maintains the standing "Version Packages" PR from pending changesets;
      # when that PR is merged, this same step builds and publishes instead.
      - name: Version PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

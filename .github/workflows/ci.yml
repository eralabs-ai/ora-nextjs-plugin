name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (prettier)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  fixtures:
    name: fixtures build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Install just ora-catalog's own deps first (not the fixtures') so it can be built
      # before the fixtures' node_modules are linked. pnpm creates node_modules/.bin bin
      # shims at install time — if the fixtures were installed now, dist/bin.js wouldn't
      # exist yet and the `ora-catalog` shim would silently fail to link (a plain
      # `pnpm install --frozen-lockfile` afterwards does NOT fix this: pnpm sees the
      # lockfile is unchanged and short-circuits as "already up to date" without
      # re-linking anything).
      - name: Install ora-catalog's dependencies
        run: pnpm install --filter ora-catalog --frozen-lockfile

      - name: Build ora-catalog
        run: pnpm --filter ora-catalog run build

      # Now install everything else. dist/bin.js exists, so the fixtures' `ora-catalog`
      # bin shims (needed for their `postbuild` step) link correctly this time.
      - name: Install remaining dependencies
        run: pnpm install --frozen-lockfile

      # Phase 0 safety net: every fixture must `next build`. Replaced by the Phase 2.6
      # snapshot-and-validate suite once the generator exists.
      - name: Build fixtures
        run: pnpm fixtures:build

      # Official ARD conformance tool (vendored from ards-project/ard-spec — spec/ard/README.md)
      # over every catalog the fixture builds just generated. jsonschema enables the tool's strict
      # JSON Schema layer on top of its semantic checks.
      - name: Install jsonschema for the conformance tool
        run: pip install jsonschema

      - name: ARD conformance (official tool)
        run: pnpm conformance

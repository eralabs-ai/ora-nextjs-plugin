name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (prettier)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  fixtures:
    name: fixtures build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Install just ax's own deps first (not the fixtures') so it can be built
      # before the fixtures' node_modules are linked. pnpm creates node_modules/.bin bin
      # shims at install time — if the fixtures were installed now, dist/bin.js wouldn't
      # exist yet and the `ax` shim would silently fail to link (a plain
      # `pnpm install --frozen-lockfile` afterwards does NOT fix this: pnpm sees the
      # lockfile is unchanged and short-circuits as "already up to date" without
      # re-linking anything).
      - name: Install ax's dependencies
        run: pnpm install --filter @ora-ai/ax-nextjs --frozen-lockfile

      - name: Build ax
        run: pnpm --filter @ora-ai/ax-nextjs run build

      # Now install everything else. dist/bin.js exists, so the fixtures' `ax`
      # bin shims (needed for their `postbuild` step) link correctly this time.
      - name: Install remaining dependencies
        run: pnpm install --frozen-lockfile

      # Every fixture must `next build` — that build also runs each fixture's `ax --report`
      # postbuild, writing a machine-readable report to its `.ax/report.json`.
      - name: Build fixtures
        run: pnpm fixtures:build

      # Report-snapshot layer: diff each freshly-built `.ax/report.json` against its committed,
      # normalized golden (`fixtures/*/report.golden.json`). Proves the plugin's detections and
      # recommendations are exactly what we expect for a real build of each fixture.
      - name: Verify report snapshots
        run: pnpm reports:verify

      # Dogfood the negotiation middleware over HTTP: `next start` on the built flagship fixture,
      # then the dual-fetch probes (Ora's markdown-negotiation-vary semantics), the cloaking
      # guards, and the gated/dynamic/unknown-path branches — the Edge bundle serving for real.
      - name: Middleware dual-fetch dogfood
        run: pnpm dogfood:middleware

      # Multi-build mutation tests over the flagship fixture: idempotence, user-edit preservation,
      # orphaned-twin cleanup, additive change, and manifest drift — each is a copy → build →
      # mutate → rebuild sequence with targeted delta assertions (the build-N+1 bugs the one-shot
      # golden layer can't see).
      - name: Flagship mutation tests
        run: pnpm mutation:test

      # Official ARD conformance tool (vendored from ards-project/ard-spec — spec/ard/README.md)
      # over every catalog the fixture builds just generated. jsonschema enables the tool's strict
      # JSON Schema layer on top of its semantic checks.
      - name: Install jsonschema for the conformance tool
        run: pip install jsonschema

      - name: ARD conformance (official tool)
        run: pnpm conformance

  package:
    name: pack + publint + attw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter @ora-ai/ax-nextjs --frozen-lockfile

      - name: Build
        run: pnpm --filter @ora-ai/ax-nextjs run build

      # Lints the publishable shape: exports map, files allowlist, main/types agreement.
      - name: publint
        run: pnpm dlx publint packages/ax

      # Verifies TypeScript consumers actually resolve the declared types.
      # esm-only profile: the package intentionally ships no CJS build.
      - name: Are the types wrong
        run: pnpm dlx @arethetypeswrong/cli --pack packages/ax --profile esm-only

      - name: Pack tarball
        run: pnpm --filter @ora-ai/ax-nextjs pack --pack-destination "$RUNNER_TEMP"

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: ${{ runner.temp }}/*.tgz
          retention-days: 7

  tarball-e2e:
    name: tarball e2e (node ${{ matrix.node }})
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18.18 is the floor `engines` claims; test exactly what we promise.
        node: ['18.18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: ${{ runner.temp }}/tarball

      # Plain node + npm on purpose: a consumer's environment, not the workspace's.
      - name: Install packed tarball into a scratch app and build it
        run: node scripts/tarball-e2e.mjs "$RUNNER_TEMP"/tarball/*.tgz
